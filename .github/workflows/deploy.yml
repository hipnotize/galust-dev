name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Build site
        run: hugo --gc --minify -d public

      - name: Render CV PDF (max 2 pages)
        run: ./scripts/build-cv-pdf.sh public

      - name: Check internal links
        run: python3 scripts/check_links.py public

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Upload with rsync
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is locked to `rrsync -wo <web root>` on the server, so the remote path is relative to it.
          rsync -rlz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" \
            public/ "site-deploy@${DEPLOY_HOST}:"

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          base="${SITE_URL%/}/"
          for path in "" cv/ cv/Galust_Arakelyan_DevOps.pdf; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${base}${path}")
            echo "${base}${path} -> $code"
            [ "$code" = 200 ]
          done
