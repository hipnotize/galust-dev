    summary: "Sized the target platform from real peak usage (10 VMs, 100 vCPU, 328 GB RAM), built Vault as a 3-node Raft cluster, RabbitMQ, Redpanda with SCRAM, ACLs and mTLS, and Redis, and staged every workload through a Velero pipeline."
