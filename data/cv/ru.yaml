summary: "DevOps-инженер, почти 7 лет в Linux-инфраструктуре и DevOps. Сейчас отвечаю за прод на Kubernetes в финтех-группе: Yandex Cloud, VMware Cloud Director и своё железо. Когда облачный провайдер потерял две из трёх зон доступности, снял копию прода и за один день поднял Vault, Redis, RabbitMQ и 125 сервисов на новом Kubernetes в офисе. Работаю руками с Kubernetes, Terraform, Vault, GitLab CI, Argo CD и сервисами с состоянием: PostgreSQL, RabbitMQ, Redis, Kafka/Redpanda. Ментор в онлайн-школе DevOps, около 100 учеников."

experience:
