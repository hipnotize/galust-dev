    note: "финтех-группа (JoyMoney, Boostr, Nibble)"
    dates: "май 2026 — н. в."
    bullets:
      - "Снял копию прода, когда провайдер потерял две из трёх зон, а у нод не было интернета: запустил Velero вне кластера и забрал весь кластер на 349 нагрузок (10 466 объектов, 0 ошибок), все 123 прод-образа (19,7 ГБ после дедупликации слоёв) и данные Vault, Redis, RabbitMQ и Redpanda, всё со сверкой контрольных сумм."
      - "За один день поднял прод на новом Kubernetes в офисе (Talos, Ceph): Vault из raft-снапшота, Redis (425 тыс. ключей), RabbitMQ (781 очередь, 5,9 млн сообщений), mTLS-прокси к бюро кредитных историй и банкам и 125 сервисов при нуле реплик."
      - "Подготовил переезд прода в VMware Cloud Director: рассчитал ёмкость по реальным пикам (10 ВМ, 100 vCPU, 328 ГБ RAM), поднял Vault на 3 узлах Raft, RabbitMQ, Redpanda с SCRAM, ACL и mTLS, Redis, и залил 273 деплоймента и 347 ингрессов через Velero."
      - "Перевёл Vault с file storage на Raft: 47,6 тыс. ключей, простой 13,7 минуты, 0 расхождений; настроил снапшоты в S3 по расписанию и проверил цепочку целиком, включая восстановление."
      - "За полтора дня собрал с нуля прод-контур для отчётности в бюро кредитных историй: перенёс 3 базы PostgreSQL (54 ГБ, 351 млн строк, 0 расхождений), поднял Kubernetes 1.36 на Talos, Vault, RabbitMQ и ГОСТ-mTLS к бюро."
      - "Перевёл 16 компонентов с состоянием (Redis, Redis Cluster, RabbitMQ) в 4 окружениях на новые источники образов после изменений в каталоге Bitnami, 7 из них на проде в ночные окна, со снимками дисков перед каждым шагом и без потери данных."
      - "Внедрил логирование на Loki и Grafana Alloy с хранением в MinIO и сроком 30 дней, после замеров нагрузки урезал бюджет ресурсов в 4 раза."
      - "Разобрал около 50 инцидентов на проде и стейдже по фактам: аудит apiserver, Loki, смещения в OpenSearch, история Helm. Например: OOM Redis Sentinel из-за дрейфа чарта (192 MiB в Git против 4 GiB вживую), 503 у Terraform state из-за NO_PROXY в раннере и 12 903 записи логов, скрытые из-за потерянных полей трассировки, — вернул через ingest pipelines OpenSearch."
      - "Поддерживал общие шаблоны GitLab CI и пайплайны Terraform: починил общую джобу миграций БД, вернул Terraform CI в 6+ проектах, добавил релизные и ручные деплои для 3 изолированных QA-стендов (Istio Ambient, политики Vault через Terraform)."
      - "Автоматизировал массовые изменения с dry-run, записью через проверку версии и журналом отката: обновил 246 секретов Vault без ошибок и исправил 403 после переезда на 132 из 136 ингрессов."
